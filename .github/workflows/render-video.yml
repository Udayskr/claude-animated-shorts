name: Render animated short

on:
  push:
    branches:
      - feat/edge-tts-github-actions
    paths:
      - "video-config.json"
      - "package.json"
      - "requirements.txt"
      - ".github/workflows/render-video.yml"
      - "scripts/**"
      - "src/**"
      - "templates/bridge/**"
  workflow_dispatch:
    inputs:
      script:
        description: "English narration script"
        required: true
        type: string
        default: "Seventy-four soldiers marched across an iron bridge in perfect rhythm. Each footstep pushed the bridge a little harder. The whole structure began to sway, until the marching itself helped bring it crashing down."
      voice:
        description: "English voice"
        required: true
        type: choice
        options:
          - en-US-GuyNeural
          - en-US-AriaNeural
          - en-US-JennyNeural
        default: en-US-GuyNeural
      duration_seconds:
        description: "Minimum render length in seconds (5 to 67); longer voice automatically extends video"
        required: true
        type: string
        default: "10"

permissions:
  contents: read

jobs:
  render:
    name: Generate voice, subtitles and MP4
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Install Edge TTS
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate requested render duration
        env:
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
        run: |
          python - <<'PY'
          import json
          import os
          with open("video-config.json", encoding="utf-8") as file:
              config = json.load(file)
          seconds = int(os.environ.get("DURATION_SECONDS") or config.get("duration_seconds", 10))
          if not 5 <= seconds <= 67:
              raise SystemExit("duration_seconds must be between 5 and 67")
          PY

      - name: Generate English narration and word-timed subtitles
        env:
          SCRIPT_TEXT: ${{ inputs.script }}
          VOICE_NAME: ${{ inputs.voice }}
        run: python scripts/generate_voice.py

      - name: Match render duration to narration
        id: duration
        env:
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
        run: |
          python - <<'PY'
          import json
          import math
          import os
          with open("video-config.json", encoding="utf-8") as file:
              config = json.load(file)
          requested = int(os.environ.get("DURATION_SECONDS") or config.get("duration_seconds", 10))
          with open("out/audio-duration.json", encoding="utf-8") as file:
              audio_seconds = float(json.load(file)["audio_duration_seconds"])
          if audio_seconds > 66.5:
              raise SystemExit(f"Narration is {audio_seconds:.2f}s; maximum supported narration is 66.5s for this 67.5s animation.")
          render_seconds = max(requested, math.ceil(audio_seconds + 0.5))
          if render_seconds > 67:
              raise SystemExit("The narration plus ending buffer exceeds the 67-second render limit.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("render_seconds=" + str(render_seconds) + "\n")
              output.write("last_frame=" + str(render_seconds * 30 - 1) + "\n")
          print(f"Voice: {audio_seconds:.2f}s; video render: {render_seconds}s")
          PY

      - name: Render vertical MP4 (full-resolution stable render)
        run: npx remotion render src/index.ts BridgeShort out/animated-short.mp4 --frames="0-${{ steps.duration.outputs.last_frame }}" --props='{"post":{"ink":true,"lens":true,"pre":false,"bloom":true,"grade":true,"grain":false,"dpr":1.0}}' --codec=h264 --crf=18 --concurrency=1 --timeout=120000

      - name: Upload MP4 and subtitle files
        uses: actions/upload-artifact@v4
        with:
          name: animated-short-${{ github.run_number }}
          path: |
            out/animated-short.mp4
            out/captions.srt
            out/segments.json
            out/audio-duration.json
          if-no-files-found: error
          retention-days: 7
