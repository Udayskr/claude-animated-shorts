name: Profile render concurrency (diagnostic only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    name: Compare production render concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out production render source
        uses: actions/checkout@v4
        with:
          ref: feat/edge-tts-github-actions

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Install FFmpeg for decoded-frame comparison
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Record runner information
        run: |
          mkdir -p out/profile
          {
            echo "Date: $(date -u +%FT%TZ)"
            echo "Runner: $(uname -a)"
            echo "CPU threads:"
            nproc
            echo "Memory:"
            free -h
          } | tee out/profile/runner-info.txt

      # These props match the current production workflow exactly: full effects, pre=false, DPR 1.0.
      # Only concurrency changes. Render 30 identical frames at production resolution and CRF.
      - name: Round 1 - concurrency 1
        run: |
          /usr/bin/time -f "round1_c1_seconds=%e" -o out/profile/timings.txt -a \
            npx remotion render src/profile-index.ts BridgeProfile out/profile/r1-c1.mp4 \
            --frames="0-29" \
            --props='{"post":{"ink":true,"lens":true,"pre":false,"bloom":true,"grade":true,"grain":false,"dpr":1.0}}' \
            --codec=h264 --crf=18 --concurrency=1 --timeout=120000

      - name: Round 1 - concurrency 2 (production setting)
        run: |
          /usr/bin/time -f "round1_c2_seconds=%e" -o out/profile/timings.txt -a \
            npx remotion render src/profile-index.ts BridgeProfile out/profile/r1-c2.mp4 \
            --frames="0-29" \
            --props='{"post":{"ink":true,"lens":true,"pre":false,"bloom":true,"grade":true,"grain":false,"dpr":1.0}}' \
            --codec=h264 --crf=18 --concurrency=2 --timeout=120000

      - name: Round 1 - concurrency 4
        run: |
          /usr/bin/time -f "round1_c4_seconds=%e" -o out/profile/timings.txt -a \
            npx remotion render src/profile-index.ts BridgeProfile out/profile/r1-c4.mp4 \
            --frames="0-29" \
            --props='{"post":{"ink":true,"lens":true,"pre":false,"bloom":true,"grade":true,"grain":false,"dpr":1.0}}' \
            --codec=h264 --crf=18 --concurrency=4 --timeout=120000

      - name: Round 2 - concurrency 2 (production setting)
        run: |
          /usr/bin/time -f "round2_c2_seconds=%e" -o out/profile/timings.txt -a \
            npx remotion render src/profile-index.ts BridgeProfile out/profile/r2-c2.mp4 \
            --frames="0-29" \
            --props='{"post":{"ink":true,"lens":true,"pre":false,"bloom":true,"grade":true,"grain":false,"dpr":1.0}}' \
            --codec=h264 --crf=18 --concurrency=2 --timeout=120000

      - name: Round 2 - concurrency 4
        run: |
          /usr/bin/time -f "round2_c4_seconds=%e" -o out/profile/timings.txt -a \
            npx remotion render src/profile-index.ts BridgeProfile out/profile/r2-c4.mp4 \
            --frames="0-29" \
            --props='{"post":{"ink":true,"lens":true,"pre":false,"bloom":true,"grade":true,"grain":false,"dpr":1.0}}' \
            --codec=h264 --crf=18 --concurrency=4 --timeout=120000

      - name: Round 2 - concurrency 1
        run: |
          /usr/bin/time -f "round2_c1_seconds=%e" -o out/profile/timings.txt -a \
            npx remotion render src/profile-index.ts BridgeProfile out/profile/r2-c1.mp4 \
            --frames="0-29" \
            --props='{"post":{"ink":true,"lens":true,"pre":false,"bloom":true,"grade":true,"grain":false,"dpr":1.0}}' \
            --codec=h264 --crf=18 --concurrency=1 --timeout=120000

      - name: Round 3 - concurrency 4
        run: |
          /usr/bin/time -f "round3_c4_seconds=%e" -o out/profile/timings.txt -a \
            npx remotion render src/profile-index.ts BridgeProfile out/profile/r3-c4.mp4 \
            --frames="0-29" \
            --props='{"post":{"ink":true,"lens":true,"pre":false,"bloom":true,"grade":true,"grain":false,"dpr":1.0}}' \
            --codec=h264 --crf=18 --concurrency=4 --timeout=120000

      - name: Round 3 - concurrency 1
        run: |
          /usr/bin/time -f "round3_c1_seconds=%e" -o out/profile/timings.txt -a \
            npx remotion render src/profile-index.ts BridgeProfile out/profile/r3-c1.mp4 \
            --frames="0-29" \
            --props='{"post":{"ink":true,"lens":true,"pre":false,"bloom":true,"grade":true,"grain":false,"dpr":1.0}}' \
            --codec=h264 --crf=18 --concurrency=1 --timeout=120000

      - name: Round 3 - concurrency 2 (production setting)
        run: |
          /usr/bin/time -f "round3_c2_seconds=%e" -o out/profile/timings.txt -a \
            npx remotion render src/profile-index.ts BridgeProfile out/profile/r3-c2.mp4 \
            --frames="0-29" \
            --props='{"post":{"ink":true,"lens":true,"pre":false,"bloom":true,"grade":true,"grain":false,"dpr":1.0}}' \
            --codec=h264 --crf=18 --concurrency=2 --timeout=120000

      - name: Compare decoded video frames for visual consistency
        run: |
          set -e
          for file in out/profile/*.mp4; do
            ffmpeg -v error -i "$file" -map 0:v:0 -f framemd5 "${file%.mp4}.framemd5"
          done
          reference="out/profile/r1-c1.framemd5"
          {
            echo "Reference: $reference"
            for file in out/profile/*.framemd5; do
              if cmp -s "$reference" "$file"; then
                echo "IDENTICAL: $file"
              else
                echo "DIFFERENT: $file"
              fi
            done
          } | tee out/profile/frame-comparison.txt

      - name: Upload concurrency benchmark
        uses: actions/upload-artifact@v4
        with:
          name: render-concurrency-profile-${{ github.run_number }}
          path: out/profile/
          if-no-files-found: error
          retention-days: 7
